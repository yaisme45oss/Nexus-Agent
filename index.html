// ─── API KEY CONFIG ───────────────────────────────────────────────────────────
// Replace YOUR_API_KEY_HERE with your actual Anthropic API key before deploying
const HARDCODED_KEY = "YOUR_API_KEY_HERE";

// ─── COLORS ───────────────────────────────────────────────────────────────────
const C = {
  bg:"#07090b", card:"#0d1117", panel:"#111820", border:"#1a2030",
  dim:"#283040", muted:"#4a5870", body:"#8ea0b8", text:"#c5d5e8", white:"#e8f0fa",
  green:"#00cc88", blue:"#4488ff", amber:"#f0a030", red:"#ff4466",
  purple:"#9966ff", cyan:"#00ccee", pink:"#ff66aa",
};
const mono = "'JetBrains Mono',monospace";
const ui   = "'Inter',sans-serif";

// ─── API ──────────────────────────────────────────────────────────────────────
const SYSTEM = `You are an expert AI Marketing Agent specialized in the Malaysian market, Kuala Lumpur. You help local business owners grow their digital presence on Instagram, Facebook, Google Business Profile, Websites (SEO), and Ads.

Write in a natural human-like way. Casual/bold for social media, professional for Google Business and ads.

STRICT OUTPUT — return ONLY valid raw JSON, zero markdown, zero backticks:
{"action":"short title","content":"full generated content","reason":"why this works for Malaysian audience","expected_result":"realistic engagement/reach/leads prediction"}`;

async function callAgent(apiKey, prompt) {
  const res = await fetch("https://api.anthropic.com/v1/messages", {
    method:"POST",
    headers:{"Content-Type":"application/json","x-api-key": apiKey, "anthropic-version":"2023-06-01", "anthropic-dangerous-direct-browser-access":"true"},
    body: JSON.stringify({
      model:"claude-sonnet-4-20250514", max_tokens:2000, system:SYSTEM,
      messages:[{role:"user",content:prompt}]
    })
  });
  if (!res.ok) {
    const e = await res.json().catch(()=>({}));
    throw new Error(e.error?.message || `API Error ${res.status}`);
  }
  const d = await res.json();
  const raw = d.content[0].text.trim().replace(/^```json\s*/i,"").replace(/\s*```$/,"").trim();
  try { return JSON.parse(raw); }
  catch { return {action:"Response",content:raw,reason:"Direct output",expected_result:"See above"}; }
}

// ─── SHARED COMPONENTS ────────────────────────────────────────────────────────
const { useState, useCallback, useEffect, useRef } = React;

function Field({label, hint, children}) {
  return (
    <div style={{marginBottom:14}}>
      <div style={{display:"flex",justifyContent:"space-between",marginBottom:5}}>
        <label style={{fontFamily:ui,fontSize:12,fontWeight:600,color:C.body}}>{label}</label>
        {hint && <span style={{fontFamily:ui,fontSize:11,color:C.muted}}>{hint}</span>}
      </div>
      {children}
    </div>
  );
}

const iS = (x={}) => ({
  width:"100%", padding:"10px 12px",
  background:C.panel, border:`1px solid ${C.border}`,
  borderRadius:7, color:C.text, fontFamily:ui, fontSize:13,
  boxSizing:"border-box", transition:"border-color 0.15s", ...x
});

function G2({children,gap=12}) {
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap}}>{children}</div>;
}
function G3({children}) {
  return <div style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:10}}>{children}</div>;
}

function Pills({items, value, onChange, color=C.blue}) {
  return (
    <div style={{display:"flex",flexWrap:"wrap",gap:8}}>
      {items.map(item => {
        const v = typeof item==="string"?item:item.value;
        const l = typeof item==="string"?item:item.label;
        const on = value===v;
        return (
          <div key={v} onClick={()=>onChange(v)} style={{
            padding:"7px 15px", borderRadius:20, cursor:"pointer",
            border:`1px solid ${on?color:C.border}`,
            background: on?color+"22":"transparent",
            fontFamily:ui, fontSize:12, fontWeight: on?600:400,
            color: on?color:C.muted, transition:"all 0.12s", userSelect:"none",
          }}>{l}</div>
        );
      })}
    </div>
  );
}

function LangToggle({value,onChange}) {
  return (
    <div style={{display:"flex",alignItems:"center",gap:8,marginBottom:14}}>
      <span style={{fontFamily:ui,fontSize:12,fontWeight:600,color:C.body}}>Language:</span>
      {[["en","🇬🇧 English"],["bm","🇲🇾 Bahasa Malaysia"],["both","Both"]].map(([v,l])=>(
        <div key={v} onClick={()=>onChange(v)} style={{
          padding:"5px 13px", borderRadius:20, cursor:"pointer",
          border:`1px solid ${value===v?C.blue:C.border}`,
          background:value===v?C.blue+"22":"transparent",
          fontFamily:ui,fontSize:11,fontWeight:500,
          color:value===v?C.blue:C.muted, transition:"all 0.12s",
        }}>{l}</div>
      ))}
    </div>
  );
}

function RunBtn({onClick,disabled,color=C.green,children,full=false}) {
  const [hover,setHover] = useState(false);
  return (
    <button onClick={onClick} disabled={disabled}
      onMouseEnter={()=>setHover(true)} onMouseLeave={()=>setHover(false)}
      style={{
        padding:"12px 28px", width:full?"100%":"auto",
        background: disabled?"transparent": hover?color+"33":color+"22",
        border:`1.5px solid ${disabled?C.dim:color}`,
        color:disabled?C.muted:color,
        borderRadius:8, fontWeight:700, fontSize:14,
        cursor:disabled?"not-allowed":"pointer", transition:"all 0.15s",
        letterSpacing:"0.01em",
      }}>{children}</button>
  );
}

function CopyBtn({text}) {
  const [done,setDone] = useState(false);
  const copy = () => {
    navigator.clipboard?.writeText(text||"").then(()=>{setDone(true);setTimeout(()=>setDone(false),2000);});
  };
  return (
    <button onClick={copy} style={{
      padding:"5px 14px",
      background:done?C.green+"22":"transparent",
      border:`1px solid ${done?C.green:C.dim}`,
      color:done?C.green:C.muted, borderRadius:5,
      fontSize:11,fontWeight:500, transition:"all 0.2s",
    }}>{done?"✓ Copied!":"Copy"}</button>
  );
}

function ErrorBanner({msg,onClose}) {
  if (!msg) return null;
  return (
    <div style={{padding:"12px 16px",background:C.red+"15",border:`1px solid ${C.red}44`,borderRadius:8,marginBottom:16,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
      <span style={{fontFamily:ui,fontSize:13,color:C.red}}>⚠ {msg}</span>
      <button onClick={onClose} style={{background:"none",border:"none",color:C.muted,fontSize:18,padding:"0 4px"}}>×</button>
    </div>
  );
}

function BizBanner({biz,onEdit}) {
  if (!biz.name) return (
    <div style={{padding:"10px 14px",background:C.amber+"12",border:`1px solid ${C.amber}30`,borderRadius:7,marginBottom:18,display:"flex",alignItems:"center",gap:8}}>

      <span style={{fontFamily:ui,fontSize:12,color:C.amber}}>Set your business profile on the <b>Dashboard</b> for better results on every module.</span>
    </div>

    <div style={{padding:"8px 14px",background:C.green+"12",border:`1px solid ${C.green}30`,borderRadius:7,marginBottom:18,display:"flex",alignItems:"center",gap:10}}>
      <div style={{width:7,height:7,borderRadius:"50%",background:C.green,flexShrink:0}}/>
      <span style={{fontFamily:ui,fontSize:12,fontWeight:600,color:C.green}}>Active:</span>
      <span style={{fontFamily:ui,fontSize:12,color:C.body}}>{biz.name} · {biz.industry||"—"} · {biz.location}</span>
      <button onClick={onEdit} style={{marginLeft:"auto",padding:"3px 10px",background:"none",border:`1px solid ${C.dim}`,borderRadius:4,color:C.muted,fontSize:11}}>Edit</button>

}

function OutputCard({res,loading,color=C.green,onSave}) {
  if (!res && !loading) return null;
  if (loading) return (
    <div className="fade-in" style={{marginTop:16,padding:18,background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${color}`,borderRadius:8,display:"flex",alignItems:"center",gap:10}}>

      <span style={{fontFamily:ui,fontSize:13,color}}>Agent is thinking…</span>

  return (
    <div className="fade-in" style={{marginTop:16,background:C.card,border:`1px solid ${C.border}`,borderLeft:`3px solid ${color}`,borderRadius:8,overflow:"hidden"}}>

        <div style={{display:"flex",alignItems:"center",gap:8}}>
          <div style={{width:7,height:7,borderRadius:"50%",background:color,boxShadow:`0 0 7px ${color}`}}/>
          <span style={{fontFamily:ui,fontWeight:700,fontSize:12,color,letterSpacing:"0.04em"}}>{res.action}</span>
        </div>
        <div style={{display:"flex",gap:8}}>
          <CopyBtn text={res.content}/>
          {onSave && <button onClick={onSave} style={{padding:"5px 14px",background:"transparent",border:`1px solid ${C.dim}`,color:C.muted,borderRadius:5,fontSize:11,fontWeight:500}}>💾 Save</button>}
        </div>
      </div>
      <div style={{padding:"18px 20px"}}>
        <div style={{fontFamily:ui,fontSize:13,color:C.white,lineHeight:1.85,whiteSpace:"pre-wrap",marginBottom:16}}>{res.content}</div>
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:12,borderTop:`1px solid ${C.border}`,paddingTop:14}}>
          <div style={{background:C.panel,borderRadius:7,padding:"12px 14px"}}>
            <div style={{fontFamily:ui,fontSize:10,fontWeight:700,color:C.muted,letterSpacing:"0.08em",marginBottom:6,textTransform:"uppercase"}}>Why This Works</div>
            <p style={{fontFamily:ui,fontSize:12,color:C.body,margin:0,lineHeight:1.65}}>{res.reason}</p>

            <p style={{fontFamily:ui,fontSize:12,color:C.amber,margin:0,lineHeight:1.65}}>{res.expected_result}</p>
          </div>
        </div>
      </div>
    </div>
  );
}

function SectionHeader({title,sub,color}) {
  return (
    <div style={{marginBottom:24}}>
      <h2 style={{fontFamily:ui,fontWeight:800,fontSize:22,color:C.white,margin:"0 0 6px"}}>{title}</h2>
      <p style={{fontFamily:ui,fontSize:13,color:C.muted,margin:0}}>{sub}</p>

// ─── SETUP / API KEY MODAL ────────────────────────────────────────────────────
function SetupModal({onDone}) {
  const [key,setKey] = useState("");
  const [err,setErr] = useState("");
  const [testing,setTesting] = useState(false);

  const test = async () => {
    if (!key.trim()) return;
    setTesting(true); setErr("");
    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json","x-api-key":key.trim(),"anthropic-version":"2023-06-01","anthropic-dangerous-direct-browser-access":"true"},
        body:JSON.stringify({model:"claude-haiku-4-5-20251001",max_tokens:10,messages:[{role:"user",content:"hi"}]})
      });
      if (res.ok) { onDone(key.trim()); }
      else { const e = await res.json(); setErr(e.error?.message||"Invalid API key"); }
    } catch(e) { setErr("Connection failed. Check your key and try again."); }
    setTesting(false);
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(7,9,11,0.95)",display:"flex",alignItems:"center",justifyContent:"center",zIndex:9999,padding:20}}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:14,padding:40,maxWidth:480,width:"100%"}}>
        <div style={{fontFamily:ui,fontWeight:900,fontSize:28,color:C.white,marginBottom:6}}>NEXUS</div>
        <div style={{fontFamily:ui,fontSize:13,color:C.muted,marginBottom:28}}>AI Marketing Agent — Enter your Anthropic API key to begin</div>
        <Field label="Anthropic API Key">
          <input type="password" value={key} onChange={e=>setKey(e.target.value)}
            onKeyDown={e=>e.key==="Enter"&&test()}
            placeholder="sk-ant-..." style={iS()} />
        </Field>
        {err && <div style={{padding:"10px 14px",background:C.red+"15",border:`1px solid ${C.red}44`,borderRadius:7,marginBottom:14,fontFamily:ui,fontSize:12,color:C.red}}>{err}</div>}
        <RunBtn onClick={test} disabled={testing||!key.trim()} color={C.green} full>
          {testing?"Testing connection…":"Connect & Start"}
        </RunBtn>
        <p style={{fontFamily:ui,fontSize:11,color:C.dim,marginTop:14,lineHeight:1.6}}>
          Get your API key at <a href="https://console.anthropic.com" target="_blank" style={{color:C.blue}}>console.anthropic.com</a>. Your key is never stored — it only lives in this browser session.
        </p>
      </div>
    </div>
  );
}

// ─── CONTENT CREATOR ──────────────────────────────────────────────────────────
function ContentCreator({apiKey,biz,onNav,onSave,onLog}) {
  const [platform,setP]=useState("Instagram");
  const [tone,setT]=useState("Bold & Engaging");
  const [topic,setTp]=useState("");
  const [lang,setLang]=useState("en");
  const [loading,setL]=useState(false);
  const [res,setR]=useState(null);
  const [error,setE]=useState("");

  const run=async()=>{
    if(!topic.trim())return;
    setL(true);setR(null);setE("");
    try{
      const r=await callAgent(apiKey,`CONTENT CREATION
Business: ${biz.name||"KL local business"}, ${biz.industry||""}, ${biz.location||"KL"}
Platform: ${platform} | Tone: ${tone}
Language: ${lang==="en"?"English":lang==="bm"?"Bahasa Malaysia":"Both English AND Bahasa Malaysia (provide both)"}

      <ErrorBanner msg={error} onClose={()=>setE("")}/>
      <Field label="What do you need?">
        <Pills items={MODES} value={mode} onChange={setMode} color={C.purple}/>
      </Field>
      <Field label="Context / Details" hint="More detail = better strategy">
        <textarea value={input} onChange={e=>setInput(e.target.value)} rows={4}
          placeholder={
            mode==="score"?"Paste your caption, ad copy, or post content here...":
            mode==="improve"?"Describe your campaign — platform, what you ran, results...":
            mode==="calendar"?"Campaign theme, key dates, products to feature...":
            mode==="compete"?"Who are your competitors? Current advantages?":
            "Current marketing, budget, goals, challenges..."
          }
          style={iS({resize:"vertical"})}/>
      </Field>
      <RunBtn onClick={run} disabled={loading} color={C.purple} full>
        {loading?"◆ Analyzing…":"◆ Run Strategy Engine"}
      </RunBtn>
      <OutputCard res={res} loading={loading} color={C.purple} onSave={()=>onSave(res,"Strategy Engine")}/>
    </div>
  );
}

// ─── SAVED HISTORY ────────────────────────────────────────────────────────────
function SavedHistory({history,onClear}) {
  const [expanded,setExpanded]=useState(null);
  return (
    <div>
      <SectionHeader title="Saved Results" sub="All generated content from this session — copy or review anytime" color={C.muted}/>
      {history.length===0?(
        <div style={{padding:"60px 24px",textAlign:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:12}}>
          <div style={{fontSize:36,marginBottom:12}}>📂</div>
          <div style={{fontFamily:ui,fontSize:15,fontWeight:600,color:C.body,marginBottom:6}}>No saved results yet</div>
          <div style={{fontFamily:ui,fontSize:13,color:C.muted}}>Click "💾 Save" on any output to store it here</div>
        </div>
      ):(
        <>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",marginBottom:14}}>
            <span style={{fontFamily:ui,fontSize:13,color:C.muted}}>{history.length} result{history.length>1?"s":""} saved</span>
            <button onClick={onClear} style={{padding:"6px 14px",background:"transparent",border:`1px solid ${C.dim}`,color:C.muted,borderRadius:6,fontSize:12}}>Clear All</button>
          </div>
          {[...history].reverse().map((h,i)=>(
            <div key={i} style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,marginBottom:10,overflow:"hidden"}}>
              <div onClick={()=>setExpanded(expanded===i?null:i)} style={{padding:"12px 16px",cursor:"pointer",display:"flex",justifyContent:"space-between",alignItems:"center",background:expanded===i?C.panel:C.card,transition:"background 0.12s"}}>
                <div style={{display:"flex",gap:10,alignItems:"center"}}>
                  <span style={{fontFamily:ui,fontSize:11,fontWeight:600,color:C.blue,background:C.blue+"15",padding:"2px 8px",borderRadius:4}}>{h.module}</span>
                  <span style={{fontFamily:ui,fontSize:12,color:C.body}}>{h.action}</span>
                </div>
                <div style={{display:"flex",gap:8,alignItems:"center"}}>
                  <span style={{fontFamily:ui,fontSize:11,color:C.dim}}>{h.time}</span>
                  <CopyBtn text={h.content}/>
                  <span style={{color:C.muted,fontSize:12}}>{expanded===i?"▲":"▼"}</span>
                </div>
              </div>
              {expanded===i&&(
                <div style={{padding:"16px 18px",borderTop:`1px solid ${C.border}`}}>
                  <div style={{fontFamily:ui,fontSize:13,color:C.white,lineHeight:1.85,whiteSpace:"pre-wrap"}}>{h.content}</div>
                </div>
              )}
            </div>
          ))}
        </>
      )}
    </div>
  );
}

// ─── ROOT APP ─────────────────────────────────────────────────────────────────
function App() {
  const [apiKey, setApiKey] = useState(HARDCODED_KEY !== "YOUR_API_KEY_HERE" ? HARDCODED_KEY : "");
  const [active, setActive] = useState("home");
  const [biz,    setBiz]    = useState({name:"",industry:"",location:"KL (General)"});
  const [history,setHistory]= useState([]);
  const [counts, setCounts] = useState({});
  const [menuOpen,setMenuOpen]=useState(false);

  const saveResult = useCallback((res, module) => {
    if (!res) return;
    const now = new Date();
    const time = `${String(now.getHours()).padStart(2,"0")}:${String(now.getMinutes()).padStart(2,"0")}`;
    setHistory(p=>[...p,{...res,module,time}]);
  },[]);

  const addLog = useCallback((mod) => {
    setCounts(p=>({...p,[mod]:(p[mod]||0)+1}));
  },[]);

  const navigate = (id) => { setActive(id); setMenuOpen(false); };

  if (!apiKey) return <SetupModal onDone={setApiKey}/>;

  const commonProps = {apiKey,biz,onNav:navigate,onSave:saveResult,onLog:addLog};

  const panels = {
    home:     <Home counts={counts} history={history} onNav={navigate} biz={biz} onSetBiz={setBiz}/>,
    content:  <ContentCreator {...commonProps}/>,
    seo:      <SEOWriter {...commonProps}/>,
    gbp:      <GoogleBiz {...commonProps}/>,
    engage:   <ReplyAssistant {...commonProps}/>,
    ads:      <AdsGen {...commonProps}/>,
    whatsapp: <WhatsAppBlasts {...commonProps}/>,
    festive:  <FestiveCampaigns {...commonProps}/>,
    email:    <EmailMarketing {...commonProps}/>,
    strategy: <StrategyEngine {...commonProps}/>,
    history:  <SavedHistory history={history} onClear={()=>setHistory([])}/>,
  };

  const total = Object.values(counts).reduce((a,b)=>a+b,0);
  const activeMod = MODS.find(m=>m.id===active);

  return (
    <div style={{display:"flex",height:"100vh",background:C.bg,overflow:"hidden"}}>

      {/* ── SIDEBAR ── */}
      <aside style={{
        width:220, flexShrink:0,
        background:C.card, borderRight:`1px solid ${C.border}`,
        display:"flex", flexDirection:"column", overflowY:"auto",
      }}>
        {/* Logo */}
        <div style={{padding:"22px 20px 16px",borderBottom:`1px solid ${C.border}`}}>
          <div style={{fontFamily:ui,fontWeight:900,fontSize:22,color:C.white,letterSpacing:"-0.02em"}}>NEXUS</div>
          <div style={{fontFamily:mono,fontSize:9,color:C.muted,letterSpacing:"0.2em",marginTop:1}}>AI MARKETING AGENT</div>
          <div style={{display:"flex",alignItems:"center",gap:7,marginTop:12}}>
            <div style={{width:7,height:7,borderRadius:"50%",background:C.green,boxShadow:`0 0 8px ${C.green}`,animation:"pulse 2s infinite"}}/>
            <span style={{fontFamily:ui,fontSize:11,fontWeight:600,color:C.green}}>Online & Ready</span>
          </div>
          {biz.name&&(
            <div onClick={()=>navigate("home")} style={{marginTop:12,padding:"8px 10px",background:C.panel,borderRadius:7,border:`1px solid ${C.border}`,cursor:"pointer"}}>
              <div style={{fontFamily:ui,fontSize:12,fontWeight:700,color:C.white}}>{biz.name}</div>
              <div style={{fontFamily:ui,fontSize:11,color:C.muted}}>{biz.industry||"—"} · {biz.location}</div>
            </div>
          )}
        </div>

        {/* Nav */}
        <nav style={{flex:1,padding:"8px 0"}}>
          {MODS.map(m=>{
            const on=active===m.id;
            const cnt=counts[m.id]||0;
            return (
              <div key={m.id} onClick={()=>navigate(m.id)} style={{
                padding:"10px 20px",cursor:"pointer",display:"flex",alignItems:"center",gap:10,
                borderLeft:`2px solid ${on?m.color:"transparent"}`,
                background:on?m.color+"14":"transparent",
                transition:"all 0.1s",
              }}
              onMouseEnter={e=>{if(!on)e.currentTarget.style.background=C.panel;}}
              onMouseLeave={e=>{if(!on)e.currentTarget.style.background="transparent";}}>
                <span style={{fontSize:13,color:on?m.color:C.dim,flexShrink:0}}>{m.icon}</span>
                <span style={{fontFamily:ui,fontSize:12,fontWeight:on?700:400,color:on?m.color:C.body}}>{m.label}</span>
                {cnt>0&&(
                  <span style={{marginLeft:"auto",fontFamily:mono,fontSize:9,color:m.color,background:m.color+"20",padding:"1px 6px",borderRadius:3}}>{cnt}</span>
                )}
              </div>
            );
          })}
        </nav>

        {/* Footer */}
        <div style={{padding:"16px 20px",borderTop:`1px solid ${C.border}`}}>
          <div style={{fontFamily:ui,fontSize:11,color:C.dim,lineHeight:2.1}}>
            <div style={{color:C.body,fontWeight:600}}>{total} generation{total!==1?"s":""} today</div>
            <div style={{color:C.green}}>✓ Platform-safe</div>
            <div style={{color:C.green}}>✓ KL-optimized</div>
            <div style={{color:C.green}}>✓ English & BM</div>
          </div>
          <button onClick={()=>setApiKey("")} style={{marginTop:10,padding:"5px 12px",background:"transparent",border:`1px solid ${C.dim}`,color:C.muted,borderRadius:5,fontFamily:ui,fontSize:11,width:"100%"}}>
            Change API Key
          </button>
        </div>
      </aside>

      {/* ── MAIN ── */}
      <main style={{flex:1,display:"flex",flexDirection:"column",overflow:"hidden"}}>
        {/* Topbar */}
        <div style={{padding:"11px 28px",background:C.card,borderBottom:`1px solid ${C.border}`,display:"flex",alignItems:"center",justifyContent:"space-between",flexShrink:0}}>
          <div style={{display:"flex",alignItems:"center",gap:6}}>
            <span style={{fontFamily:ui,fontSize:12,color:C.muted}}>NEXUS</span>
            <span style={{color:C.dim}}>/</span>
            <span style={{fontFamily:ui,fontSize:12,fontWeight:700,color:activeMod?.color||C.white}}>{activeMod?.label}</span>
          </div>
          <div style={{display:"flex",alignItems:"center",gap:14}}>
            {history.length>0&&(
              <span onClick={()=>navigate("history")} style={{fontFamily:ui,fontSize:12,color:C.purple,cursor:"pointer",fontWeight:600}}>
                {history.length} saved
              </span>
            )}
            <span style={{fontFamily:ui,fontSize:11,color:C.dim}}>AI Output: Action · Content · Reason · Expected Result</span>
          </div>
        </div>

        {/* Content */}
        <div style={{flex:1,overflowY:"auto",padding:"30px 36px"}}>
          <div style={{maxWidth:880}}>
            {panels[active]}
          </div>
        </div>
      </main>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App/>);
</script>
</body>
</html>
